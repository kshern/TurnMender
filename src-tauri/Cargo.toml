[package]
name = "turnmender"
version = "1.0.1"
description = "Local capacity continuation for Codex tasks"
authors = ["TurnMender"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "turnmender_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
chrono = "0.4"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
